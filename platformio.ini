; ESP32-C6 DevKitC with 8 MB flash.
; This fork supports only this hardware target.

[platformio]
default_envs = esp32c6dev_8MB
src_dir = ./wled00
data_dir = ./wled00/data
build_cache_dir = ~/.buildcache
extra_configs =
  platformio_override.ini
  platformio_release.ini

[env:esp32c6dev_8MB]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.05.50/platform-espressif32.zip
platform_packages =
board = esp32-c6-devkitc-1

; esp_dmx does not support ESP32-C6 UART registers.
build_unflags =
  -Wno-volatile
  -D WLED_ENABLE_DMX_INPUT
build_flags =
  -DMQTT_MAX_PACKET_SIZE=1024
  -DSECURE_CLIENT=SECURE_CLIENT_BEARSSL
  -DBEARSSL_SSL_BASIC
  -D CORE_DEBUG_LEVEL=0
  -D NDEBUG
  -Wno-attributes
  -D _IR_ENABLE_DEFAULT_=false
  -D DECODE_HASH=true
  -D DECODE_NEC=true
  -D DECODE_SONY=true
  -D DECODE_SAMSUNG=true
  -D DECODE_LG=true
  -DWLED_USE_MY_CONFIG
  -D WLED_PS_DONT_REPLACE_FX -g
  -DARDUINO_ARCH_ESP32
  -DARDUINO_ARCH_ESP32C6
  -DCONFIG_IDF_TARGET_ESP32C6=1
  -D CONFIG_ASYNC_TCP_USE_WDT=0
  -DARDUINO_USB_MODE=1
  -g
  -Wshadow=compatible-local
  -DARDUINO_ARCH_ESP32
  -D CONFIG_ASYNC_TCP_USE_WDT=0
  -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
  -D WLED_ENABLE_GIF
  -D WLED_USE_SHARED_RMT
  -D__unreachable=__builtin_unreachable
  -D WLED_ENABLE_DMX_INPUT
  -D ESP32_ARDUINO_NO_RGB_BUILTIN -D WLED_RELEASE_NAME=\"ESP32-C6_8MB\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -DARDUINO_USB_CDC_ON_BOOT=0
upload_speed = 460800
lib_deps =
  esp32async/AsyncTCP @ 3.4.10
  bitbank2/AnimatedGIF@^1.4.7
  https://github.com/Aircoookie/GifDecoder.git#bc3af189b6b1e06946569f6b4287f0b79a860f8e
  https://github.com/netmindz/esp_dmx/#ed12a2909960c92d7f144d368564e2473bd38c63
  crankyoldgit/IRremoteESP8266 @ 2.9.0
  ESPAsyncWebServerWLED = git+https://github.com/Aircoookie/ESPAsyncWebServer#ac44e32abf2a69ae650412fb6bc193c59ccac38a
  marvinroger/AsyncMqttClient @ 0.9.0
  NeoPixelBus = git+https://github.com/Makuna/NeoPixelBus#76afe832f74b0738a3fa1bba0caf389ade9e7693
lib_ignore =
  NeoESP32RmtHI
  esp_dmx

; Two 2 MB OTA app slots, filesystem, and coredump within 8 MB.
board_build.partitions = tools/WLED_ESP32_8MB.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
monitor_filters =
  esp32_exception_decoder

; Add your custom module directory name here when ready.
custom_usermods =
framework =
  arduino
monitor_speed = 115200
lib_compat_mode = strict
extra_scripts =
  pre:pio-scripts/set_metadata.py
  post:pio-scripts/output_bins.py
  post:pio-scripts/strip-floats.py
  post:pio-scripts/dynarray.py
  pre:pio-scripts/user_config_copy.py
  pre:pio-scripts/load_usermods.py
  pre:pio-scripts/build_ui.py
  post:pio-scripts/validate_modules.py
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

; Keep library manifests in control of archiving while retaining the pioarduino workaround.
[v5_pioarduino_workaround]
lib_archive = true
